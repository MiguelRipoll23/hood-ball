<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Configuration Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          hood: { bg: '#0f1117', card: '#1a1d27', border: '#2a2d3a', accent: '#6366f1', 'accent-hover': '#818cf8', danger: '#ef4444', 'danger-hover': '#dc2626', success: '#22c55e' }
        }
      }
    }
  }
</script>
</head>
<body class="bg-hood-bg text-gray-200 min-h-screen font-sans">
<div id="app" class="max-w-4xl mx-auto p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white">☁️ Cloud Configuration</h1>
      <p id="file-label" class="text-sm text-gray-500 mt-1">No file loaded</p>
    </div>
    <div class="flex gap-2">
      <button id="btn-import" onclick="importFile()" class="px-4 py-2 bg-hood-card border border-hood-border rounded-lg hover:border-gray-400 transition-colors text-sm font-medium">
        📂 Import
      </button>
      <button id="btn-save" onclick="saveFile()" disabled class="px-4 py-2 bg-hood-accent hover:bg-hood-accent-hover disabled:opacity-40 disabled:cursor-not-allowed rounded-lg transition-colors text-sm font-medium text-white">
        💾 Save
      </button>
      <button id="btn-save-as" onclick="saveFileAs()" disabled class="px-4 py-2 bg-hood-card border border-hood-border hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg transition-colors text-sm font-medium">
        📋 Save As
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-4 right-4 px-4 py-2 rounded-lg text-sm font-medium opacity-0 translate-x-4 transition-all duration-300 pointer-events-none z-50"></div>

  <!-- Add-entry form -->
  <div class="bg-hood-card border border-hood-border rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Add / Update Entry</h2>
    <div class="flex gap-3 items-end flex-wrap">
      <div class="flex-1 min-w-[140px]">
        <label class="block text-xs text-gray-500 mb-1">Key</label>
        <input id="input-key" type="text" placeholder="e.g. 9090BF7D" class="w-full bg-hood-bg border border-hood-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-hood-accent transition-colors font-mono">
      </div>
      <div class="flex-[2] min-w-[200px]">
        <label class="block text-xs text-gray-500 mb-1">Value</label>
        <input id="input-value" type="text" placeholder="e.g. 4 or true or hello" class="w-full bg-hood-bg border border-hood-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-hood-accent transition-colors font-mono">
      </div>
      <button onclick="upsertEntry()" class="px-5 py-2 bg-hood-accent hover:bg-hood-accent-hover rounded-lg text-sm font-medium text-white transition-colors whitespace-nowrap">
        ➕ Add / Update
      </button>
    </div>
  </div>

  <!-- Entries table -->
  <div class="bg-hood-card border border-hood-border rounded-xl overflow-hidden">
    <div class="px-4 py-3 border-b border-hood-border flex items-center justify-between">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Entries (<span id="entry-count">0</span>)</h2>
      <button onclick="clearAll()" id="btn-clear" class="px-3 py-1 text-xs text-gray-500 hover:text-hood-danger transition-colors disabled:opacity-30 disabled:cursor-not-allowed">Clear all</button>
    </div>
    <div id="entries-container" class="max-h-[500px] overflow-y-auto">
      <div class="px-4 py-8 text-center text-gray-600 text-sm">No entries. Add one above or import a file.</div>
    </div>
  </div>

</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
  <div class="bg-hood-card border border-hood-border rounded-xl p-6 w-96 shadow-2xl">
    <h3 class="text-lg font-semibold text-white mb-2">Confirm Deletion</h3>
    <p class="text-sm text-gray-400 mb-4">Delete entry "<span id="delete-key" class="text-white font-mono"></span>"?</p>
    <div class="flex gap-3 justify-end">
      <button onclick="closeDeleteModal()" class="px-4 py-2 bg-hood-card border border-hood-border rounded-lg hover:border-gray-400 transition-colors text-sm">Cancel</button>
      <button id="btn-confirm-delete" class="px-4 py-2 bg-hood-danger hover:bg-hood-danger-hover rounded-lg text-sm font-medium text-white transition-colors">Delete</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let config = {};
let fileHandle = null;
let pendingDeleteKey = null;
let saveTimeout = null;

// ── File System API helpers ──
function supportsFS() {
  return 'showOpenFilePicker' in window;
}

async function importFile() {
  if (!supportsFS()) {
    showToast('File System API not supported. Use a Chromium-based browser.', 'error');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    const file = await handle.getFile();
    const text = await file.text();
    config = JSON.parse(text);
    if (typeof config !== 'object' || config === null || Array.isArray(config)) {
      throw new Error('Expected a JSON object');
    }
    renderEntries();
    updateFileLabel(handle.name);
    enableSaveButtons(true);
    showToast('Imported successfully', 'success');
  } catch (err) {
    if (err.name === 'AbortError') return;
    showToast('Import failed: ' + err.message, 'error');
  }
}

async function saveFile() {
  if (!fileHandle) return saveFileAs();
  try {
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(config, null, 2));
    await writable.close();
    showToast('Saved', 'success');
  } catch (err) {
    showToast('Save failed: ' + err.message, 'error');
  }
}

async function saveFileAs() {
  if (!supportsFS()) {
    showToast('File System API not supported', 'error');
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: fileHandle?.name || 'game-configuration.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(config, null, 2));
    await writable.close();
    updateFileLabel(handle.name);
    enableSaveButtons(true);
    showToast('Saved', 'success');
  } catch (err) {
    if (err.name === 'AbortError') return;
    showToast('Save failed: ' + err.message, 'error');
  }
}

function autoSave() {
  if (!fileHandle) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveFile(), 500);
}

// ── CRUD ──
function upsertEntry() {
  const keyEl = document.getElementById('input-key');
  const valEl = document.getElementById('input-value');
  const key = keyEl.value.trim();
  if (!key) { showToast('Key is required', 'error'); return; }
  const raw = valEl.value.trim();
  let value;
  if (raw === 'true') value = true;
  else if (raw === 'false') value = false;
  else if (raw === 'null') value = null;
  else if (/^-?\d+(\.\d+)?$/.test(raw)) value = Number(raw);
  else value = raw;
  const existed = key in config;
  config[key] = value;
  keyEl.value = '';
  valEl.value = '';
  renderEntries();
  enableSaveButtons(true);
  autoSave();
  showToast(existed ? 'Updated' : 'Added', 'success');
}

function editEntry(key) {
  const val = config[key];
  document.getElementById('input-key').value = key;
  document.getElementById('input-value').value = JSON.stringify(val);
}

function requestDelete(key) {
  pendingDeleteKey = key;
  document.getElementById('delete-key').textContent = key;
  document.getElementById('delete-modal').classList.remove('hidden');
}

function closeDeleteModal() {
  pendingDeleteKey = null;
  document.getElementById('delete-modal').classList.add('hidden');
}

function confirmDelete() {
  if (!pendingDeleteKey) return;
  delete config[pendingDeleteKey];
  pendingDeleteKey = null;
  document.getElementById('delete-modal').classList.add('hidden');
  renderEntries();
  enableSaveButtons(true);
  autoSave();
  showToast('Deleted', 'success');
}

function clearAll() {
  if (Object.keys(config).length === 0) return;
  if (!confirm(`Delete all ${Object.keys(config).length} entries?`)) return;
  config = {};
  renderEntries();
  enableSaveButtons(true);
  autoSave();
  showToast('All entries cleared', 'success');
}

// ── Rendering ──
function renderEntries() {
  const container = document.getElementById('entries-container');
  const entries = Object.entries(config);
  document.getElementById('entry-count').textContent = entries.length;
  document.getElementById('btn-clear').disabled = entries.length === 0;

  if (entries.length === 0) {
    container.innerHTML = '<div class="px-4 py-8 text-center text-gray-600 text-sm">No entries. Add one above or import a file.</div>';
    return;
  }

  container.innerHTML = entries.map(([key, value]) => `
    <div class="flex items-center justify-between px-4 py-3 border-b border-hood-border hover:bg-white/[0.02] transition-colors group">
      <div class="flex-1 min-w-0 mr-4">
        <div class="font-mono text-sm text-indigo-300 truncate">${escHtml(key)}</div>
        <div class="font-mono text-xs text-gray-500 truncate mt-0.5">${typeof value}: ${escHtml(JSON.stringify(value))}</div>
      </div>
      <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button onclick="editEntry('${escAttr(key)}')" class="px-3 py-1 text-xs bg-hood-card border border-hood-border rounded hover:border-gray-400 transition-colors">✏️</button>
        <button onclick="requestDelete('${escAttr(key)}')" class="px-3 py-1 text-xs bg-hood-card border border-hood-border rounded hover:border-hood-danger transition-colors">🗑️</button>
      </div>
    </div>
  `).join('');
}

function updateFileLabel(name) {
  document.getElementById('file-label').textContent = name ? `📄 ${name}` : 'No file loaded';
}

function enableSaveButtons(enable) {
  document.getElementById('btn-save').disabled = !enable;
  document.getElementById('btn-save-as').disabled = !enable;
}

// ── Toast ──
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 z-50 ${
    type === 'error' ? 'bg-hood-danger text-white' : 'bg-hood-success text-white'
  } opacity-100 translate-x-0`;
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-x-4');
  }, 2000);
}

// ── Helpers ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ── Init ──
document.getElementById('btn-confirm-delete').addEventListener('click', confirmDelete);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDeleteModal(); });
document.getElementById('delete-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDeleteModal(); });

// Handle paste of JSON
document.addEventListener('paste', async e => {
  const text = e.clipboardData?.getData('text');
  if (!text) return;
  try {
    const data = JSON.parse(text);
    if (typeof data === 'object' && data !== null && !Array.isArray(data)) {
      e.preventDefault();
      config = data;
      fileHandle = null;
      renderEntries();
      updateFileLabel('(from clipboard)');
      enableSaveButtons(true);
      showToast('Pasted from clipboard', 'success');
    }
  } catch {}
});
</script>
</body>
</html>
