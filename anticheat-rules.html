<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Cheat Rules Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          hood: { bg: '#0f1117', card: '#1a1d27', border: '#2a2d3a', accent: '#6366f1', 'accent-hover': '#818cf8', danger: '#ef4444', 'danger-hover': '#dc2626', success: '#22c55e', warn: '#f59e0b' }
        }
      }
    }
  }
</script>
</head>
<body class="bg-hood-bg text-gray-200 min-h-screen font-sans">
<div id="app" class="max-w-5xl mx-auto p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white">🛡️ Anti-Cheat Rules</h1>
      <p id="file-label" class="text-sm text-gray-500 mt-1">No file loaded</p>
    </div>
    <div class="flex gap-2">
      <button onclick="importFile()" class="px-4 py-2 bg-hood-card border border-hood-border rounded-lg hover:border-gray-400 transition-colors text-sm font-medium">
        📂 Import
      </button>
      <button id="btn-save" onclick="saveFile()" disabled class="px-4 py-2 bg-hood-accent hover:bg-hood-accent-hover disabled:opacity-40 disabled:cursor-not-allowed rounded-lg transition-colors text-sm font-medium text-white">
        💾 Save
      </button>
      <button id="btn-save-as" onclick="saveFileAs()" disabled class="px-4 py-2 bg-hood-card border border-hood-border hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg transition-colors text-sm font-medium">
        📋 Save As
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-4 right-4 px-4 py-2 rounded-lg text-sm font-medium opacity-0 translate-x-4 transition-all duration-300 pointer-events-none z-50"></div>

  <!-- Add Rule Button -->
  <div class="mb-4">
    <button onclick="addRule()" class="px-5 py-2 bg-hood-accent hover:bg-hood-accent-hover rounded-lg text-sm font-medium text-white transition-colors">
      ➕ Add Rule
    </button>
  </div>

  <!-- Rules list -->
  <div id="rules-container" class="space-y-4">
    <div class="bg-hood-card border border-hood-border rounded-xl px-4 py-8 text-center text-gray-600 text-sm">
      No rules. Add one above or import a file.
    </div>
  </div>

</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
  <div class="bg-hood-card border border-hood-border rounded-xl p-6 w-96 shadow-2xl">
    <h3 class="text-lg font-semibold text-white mb-2">Confirm Deletion</h3>
    <p class="text-sm text-gray-400 mb-4" id="delete-message">Delete this rule?</p>
    <div class="flex gap-3 justify-end">
      <button onclick="closeDeleteModal()" class="px-4 py-2 bg-hood-card border border-hood-border rounded-lg hover:border-gray-400 transition-colors text-sm">Cancel</button>
      <button id="btn-confirm-delete" class="px-4 py-2 bg-hood-danger hover:bg-hood-danger-hover rounded-lg text-sm font-medium text-white transition-colors">Delete</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──
const RULE_TYPES = [
  { value: 0, label: 'EventRateLimit (0x00)', fields: [
    { id: 0, label: 'eventTypeId', type: 'uint16' },
    { id: 1, label: 'maxCount', type: 'float32' },
    { id: 2, label: 'windowSeconds', type: 'float32' }
  ]},
  { value: 1, label: 'MovementSpeedLimit (0x01)', fields: [
    { id: 0, label: 'maxDistance', type: 'float32' },
    { id: 1, label: 'windowSeconds', type: 'float32' },
    { id: 2, label: 'entityTypeId (0=all)', type: 'uint16' }
  ]}
];

const VALUE_TYPE_MAP = { uint16: 0x00, float32: 0x01 };
const VALUE_TYPE_LABELS = { 0x00: 'uint16', 0x01: 'float32' };

// ── State ──
let rules = [];
let fileHandle = null;
let pendingDeleteIndex = null;
let saveTimeout = null;

// ── File System API ──
function supportsFS() {
  return 'showOpenFilePicker' in window;
}

async function importFile() {
  if (!supportsFS()) { showToast('File System API not supported. Use Chromium.', 'error'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    const file = await handle.getFile();
    const text = await file.text();
    rules = JSON.parse(text);
    if (!Array.isArray(rules)) throw new Error('Expected a JSON array');
    validateRules();
    renderRules();
    updateFileLabel(handle.name);
    enableSaveButtons(true);
    showToast('Imported successfully', 'success');
  } catch (err) {
    if (err.name === 'AbortError') return;
    showToast('Import failed: ' + err.message, 'error');
  }
}

async function saveFile() {
  if (!fileHandle) return saveFileAs();
  try {
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(rules, null, 2));
    await writable.close();
    showToast('Saved', 'success');
  } catch (err) {
    showToast('Save failed: ' + err.message, 'error');
  }
}

async function saveFileAs() {
  if (!supportsFS()) { showToast('File System API not supported', 'error'); return; }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: fileHandle?.name || 'anticheat-rules.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(rules, null, 2));
    await writable.close();
    updateFileLabel(handle.name);
    enableSaveButtons(true);
    showToast('Saved', 'success');
  } catch (err) {
    if (err.name === 'AbortError') return;
    showToast('Save failed: ' + err.message, 'error');
  }
}

function autoSave() {
  if (!fileHandle) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveFile(), 500);
}

// ── Validation ──
function validateRules() {
  for (let i = 0; i < rules.length; i++) {
    const r = rules[i];
    if (typeof r.ruleId !== 'number') throw new Error(`Rule[${i}]: ruleId must be a number`);
    if (typeof r.ruleType !== 'number') throw new Error(`Rule[${i}]: ruleType must be a number`);
    if (!Array.isArray(r.fields)) throw new Error(`Rule[${i}]: fields must be an array`);
    for (let j = 0; j < r.fields.length; j++) {
      const f = r.fields[j];
      if (typeof f.fieldId !== 'number') throw new Error(`Rule[${i}].fields[${j}]: fieldId must be a number`);
      if (typeof f.valueType !== 'number') throw new Error(`Rule[${i}].fields[${j}]: valueType must be a number`);
      if (typeof f.value !== 'number') throw new Error(`Rule[${i}].fields[${j}]: value must be a number`);
    }
  }
}

// ── CRUD ──
function addRule() {
  const maxId = rules.reduce((max, r) => Math.max(max, r.ruleId), 0);
  rules.push({
    ruleId: maxId + 1,
    ruleType: 0,
    fields: [
      { fieldId: 0, valueType: 0x00, value: 0 },
      { fieldId: 1, valueType: 0x01, value: 0 },
      { fieldId: 2, valueType: 0x01, value: 0 }
    ]
  });
  renderRules();
  enableSaveButtons(true);
  autoSave();
  showToast('Rule added', 'success');
}

function duplicateRule(index) {
  const src = rules[index];
  const maxId = rules.reduce((max, r) => Math.max(max, r.ruleId), 0);
  rules.push(JSON.parse(JSON.stringify({ ...src, ruleId: maxId + 1 })));
  renderRules();
  enableSaveButtons(true);
  autoSave();
  showToast('Rule duplicated', 'success');
}

function updateRule(index, prop, value) {
  rules[index][prop] = value;
  // Reset fields when rule type changes to match template
  if (prop === 'ruleType') {
    const def = RULE_TYPES.find(t => t.value === Number(value));
    if (def) {
      rules[index].fields = def.fields.map(f => ({
        fieldId: f.id,
        valueType: VALUE_TYPE_MAP[f.type],
        value: 0
      }));
    }
  }
  enableSaveButtons(true);
  autoSave();
}

function updateField(ruleIndex, fieldIndex, prop, value) {
  rules[ruleIndex].fields[fieldIndex][prop] = value;
  enableSaveButtons(true);
  autoSave();
}

function requestDelete(index) {
  pendingDeleteIndex = index;
  const r = rules[index];
  document.getElementById('delete-message').textContent = `Delete rule #${r.ruleId} (${getRuleTypeLabel(r.ruleType)})?`;
  document.getElementById('delete-modal').classList.remove('hidden');
}

function closeDeleteModal() {
  pendingDeleteIndex = null;
  document.getElementById('delete-modal').classList.add('hidden');
}

function confirmDelete() {
  if (pendingDeleteIndex === null) return;
  rules.splice(pendingDeleteIndex, 1);
  pendingDeleteIndex = null;
  document.getElementById('delete-modal').classList.add('hidden');
  renderRules();
  enableSaveButtons(true);
  autoSave();
  showToast('Rule deleted', 'success');
}

// ── Rendering ──
function renderRules() {
  const container = document.getElementById('rules-container');

  if (rules.length === 0) {
    container.innerHTML = '<div class="bg-hood-card border border-hood-border rounded-xl px-4 py-8 text-center text-gray-600 text-sm">No rules. Add one above or import a file.</div>';
    return;
  }

  container.innerHTML = rules.map((rule, ri) => `
    <div class="bg-hood-card border border-hood-border rounded-xl overflow-hidden group">
      <!-- Rule header -->
      <div class="flex items-center gap-3 px-4 py-3 bg-white/[0.02] border-b border-hood-border">
        <span class="text-xs font-mono text-gray-600 bg-hood-bg px-2 py-0.5 rounded">#${ri}</span>
        <div class="flex items-center gap-2 flex-1">
          <label class="text-xs text-gray-500">ID</label>
          <input type="number" value="${rule.ruleId}" onchange="updateRule(${ri},'ruleId',Number(this.value))"
            class="w-20 bg-hood-bg border border-hood-border rounded px-2 py-1 text-sm font-mono focus:outline-none focus:border-hood-accent transition-colors">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-gray-500">Type</label>
          <select onchange="updateRule(${ri},'ruleType',Number(this.value))"
            class="bg-hood-bg border border-hood-border rounded px-2 py-1 text-sm focus:outline-none focus:border-hood-accent transition-colors">
            ${RULE_TYPES.map(t => `<option value="${t.value}" ${rule.ruleType === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
          </select>
        </div>
        <div class="flex gap-1 ml-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button onclick="duplicateRule(${ri})" class="px-2 py-1 text-xs bg-hood-bg border border-hood-border rounded hover:border-gray-400 transition-colors" title="Duplicate">📋</button>
          <button onclick="requestDelete(${ri})" class="px-2 py-1 text-xs bg-hood-bg border border-hood-border rounded hover:border-hood-danger transition-colors" title="Delete">🗑️</button>
        </div>
      </div>
      <!-- Fields table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-xs text-gray-500 uppercase tracking-wide border-b border-hood-border">
              <th class="text-left px-4 py-2 font-medium w-10">#</th>
              <th class="text-left px-4 py-2 font-medium">Field ID</th>
              <th class="text-left px-4 py-2 font-medium">Value Type</th>
              <th class="text-left px-4 py-2 font-medium">Value</th>
            </tr>
          </thead>
          <tbody>
            ${rule.fields.map((field, fi) => {
              const def = RULE_TYPES.find(t => t.value === rule.ruleType);
              const fieldDef = def?.fields?.find(f => f.id === field.fieldId);
              return `
              <tr class="border-b border-hood-border/50 hover:bg-white/[0.01] transition-colors">
                <td class="px-4 py-2 text-gray-600 text-xs font-mono">${fi}</td>
                <td class="px-4 py-2">
                  <input type="number" value="${field.fieldId}" onchange="updateField(${ri},${fi},'fieldId',Number(this.value))"
                    class="w-16 bg-hood-bg border border-hood-border rounded px-2 py-1 text-sm font-mono focus:outline-none focus:border-hood-accent transition-colors">
                  ${fieldDef ? `<span class="text-xs text-gray-600 ml-1">(${fieldDef.label})</span>` : ''}
                </td>
                <td class="px-4 py-2">
                  <select onchange="updateField(${ri},${fi},'valueType',Number(this.value))"
                    class="bg-hood-bg border border-hood-border rounded px-2 py-1 text-sm focus:outline-none focus:border-hood-accent transition-colors">
                    <option value="0" ${field.valueType === 0 ? 'selected' : ''}>uint16 (0x00)</option>
                    <option value="1" ${field.valueType === 1 ? 'selected' : ''}>float32 (0x01)</option>
                  </select>
                  ${fieldDef && VALUE_TYPE_MAP[fieldDef.type] !== field.valueType
                    ? `<span class="text-xs text-hood-warn ml-1">⚠ expected ${fieldDef.type}</span>` : ''}
                </td>
                <td class="px-4 py-2">
                  <input type="number" value="${field.valueType === 1 ? field.value : Math.round(field.value)}"
                    step="${field.valueType === 1 ? 'any' : '1'}"
                    onchange="updateField(${ri},${fi},'value',${field.valueType === 1 ? 'parseFloat(this.value)' : 'Math.round(Number(this.value))'})"
                    class="w-24 bg-hood-bg border border-hood-border rounded px-2 py-1 text-sm font-mono focus:outline-none focus:border-hood-accent transition-colors">
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `).join('');
}

function getRuleTypeLabel(ruleType) {
  const t = RULE_TYPES.find(t => t.value === ruleType);
  return t ? t.label : `Unknown (${ruleType})`;
}

function updateFileLabel(name) {
  document.getElementById('file-label').textContent = name ? `📄 ${name}` : 'No file loaded';
}

function enableSaveButtons(enable) {
  document.getElementById('btn-save').disabled = !enable;
  document.getElementById('btn-save-as').disabled = !enable;
}

// ── Toast ──
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 z-50 ${
    type === 'error' ? 'bg-hood-danger text-white' : 'bg-hood-success text-white'
  } opacity-100 translate-x-0`;
  setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-4'); }, 2000);
}

// ── Init ──
document.getElementById('btn-confirm-delete').addEventListener('click', confirmDelete);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDeleteModal(); });
document.getElementById('delete-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDeleteModal(); });

// Paste support
document.addEventListener('paste', async e => {
  const text = e.clipboardData?.getData('text');
  if (!text) return;
  try {
    const data = JSON.parse(text);
    if (Array.isArray(data)) {
      e.preventDefault();
      rules = data;
      validateRules();
      fileHandle = null;
      renderRules();
      updateFileLabel('(from clipboard)');
      enableSaveButtons(true);
      showToast('Pasted from clipboard', 'success');
    }
  } catch {}
});
</script>
</body>
</html>
